   Every call to the server goes through api(name, ...args), which wraps google.script.run. */

const PROJECT_COLORS = ['#f07167', '#f4a261', '#e9c46a', '#2a9d8f', '#4d96ff', '#9b5de5', '#ef476f', '#6c757d'];
const IDEA_COLORS = ['plain', 'sun', 'peach', 'rose', 'lilac', 'sky', 'mint'];
const SPARKS = [
  "What's something you keep meaning to try?",
  'What annoyed you this week that someone should fix?',
  'If you had a free Saturday to build anything, what would it be?',
  "What would make your team's week 10x easier?",

function api(name) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler((e) => reject(new Error(String((e && e.message) || e).replace(/^(Exception|Error|ScriptError):\s*/i, ''))))
      [name].apply(null, args);
  });
}

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('little:' + k)); } catch (e) { return null; } },
  set(k, v) { try { if (v == null) localStorage.removeItem('little:' + k); else localStorage.setItem('little:' + k, JSON.stringify(v)); } catch (e) { /* private mode */ } },
};

function toast(msg, err) {
  const el = document.createElement('div');
  el.className = 'toast' + (err ? ' err' : '');
  el.textContent = msg;
  const root = $('#toast-root');
  while (root.children.length >= 2) root.removeChild(root.firstChild); // at most a few at once
  root.appendChild(el);
  setTimeout(() => el.remove(), err ? 6000 : 3000);
}

/** Shows an error; "NEED_KEY" errors open the AI key setup instead. */
function fail(e) {
  const msg = (e && e.message) || String(e);
  if (/^NEED_KEY:/.test(msg)) return openKeyModal(msg.replace(/^NEED_KEY:\s*/, ''));
  toast(msg, true);
}

async function busy(key, fn) {
  if (S.busy[key]) return;
  S.busy[key] = true;
  render();
  try { return await fn(); } catch (e) { fail(e); } finally { delete S.busy[key]; render(); }
}

function copyText(text) {
  const done = () => toast('Copied');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(done).catch(() => legacyCopy(text, done));
  }
  legacyCopy(text, done);
}
function legacyCopy(text, done) {
  const t = document.createElement('textarea');
  t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
  document.body.appendChild(t); t.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast("Couldn't copy. Select the text and copy it yourself.", true); }
  t.remove();
}

function uid() { return (crypto.randomUUID && crypto.randomUUID()) || 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2); }

// ---- Dates ----------------------------------------------------------------
function localDay(d) { d = new Date(d); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function today() { return localDay(new Date()); }
function addDays(day, n) { const d = new Date(day + 'T12:00:00'); d.setDate(d.getDate() + n); return localDay(d); }
function fmtDur(sec) { sec = Math.max(0, Math.round(sec || 0)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); }
function fmtTime(d) { return new Date(d).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
function relDay(d) {
  const day = localDay(d), t = today();
  if (day === t) return 'Today';
  if (day === addDays(t, -1)) return 'Yesterday';
  if (day === addDays(t, 1)) return 'Tomorrow';
  const dt = new Date(d);
  return dt.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short', year: dt.getFullYear() === new Date().getFullYear() ? undefined : 'numeric' });
}
function fmtDue(due) {
  if (!due) return '';
  const t = today();
  if (due < t) return 'Overdue · ' + relDay(due + 'T12:00:00');
  return relDay(due + 'T12:00:00');
}
function greeting() { const h = new Date().getHours(); return h < 5 ? 'Up late' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; }

function icon(name, size, cls) {

}
function spin() { return '<span class="spinner" aria-label="Working"></span>'; }

// ---- Markdown (the small subset Little writes) ------------------------------
function inl(text, opts) {
  let s = esc(text);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  if (opts && opts.cite) s = s.replace(/\[(\d{1,2})\]/g, (m, n) => opts.cite[n] ? '<a class="cite" href="#/note/' + esc(opts.cite[n].id) + (opts.cite[n].projectId ? '?p=' + esc(opts.cite[n].projectId) : '') + '">' + n + '</a>' : m);
  return s;
}
function md(src, opts) {
  opts = opts || {};
  const out = [];
  let list = null, task = 0;
  const close = () => { if (list) out.push('</' + list + '>'); list = null; };
  const open = (t) => { if (list !== t) { close(); out.push('<' + t + '>'); list = t; } };
  String(src || '').replace(/\r/g, '').split('\n').forEach((raw) => {
    const line = raw.replace(/\s+$/, '');
    let m;
    if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { close(); const l = Math.min(m[1].length + 1, 4); out.push('<h' + l + '>' + inl(m[2], opts) + '</h' + l + '>'); }
    else if ((m = line.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*)$/))) {
      open('ul');
      const i = task++, done = m[1] !== ' ';
      const added = opts.added && opts.added(i);
      out.push('<li class="task' + (done ? ' done' : '') + '"><input type="checkbox" data-task="' + i + '"' + (done ? ' checked' : '') + (opts.tasks ? '' : ' disabled') + '><span>' + inl(m[2], opts) + '</span>' +
        (opts.todoBtn ? (added ? '<span class="chip">' + icon('check', 12) + ' On to-dos</span>' : '<button class="btn sm" data-act="actionTodo" data-i="' + i + '">+ To-do</button>') : '') + '</li>');
    }
    else if ((m = line.match(/^\s*[-*•]\s+(.*)$/))) { open('ul'); out.push('<li>' + inl(m[1], opts) + '</li>'); }
    else if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { open('ol'); out.push('<li>' + inl(m[1], opts) + '</li>'); }
    else if (!line.trim()) close();
    else { close(); out.push('<p>' + inl(line, opts) + '</p>'); }
  });
  close();
  return '<div class="md">' + out.join('') + '</div>';
}

// ---------------------------------------------------------------------------
// Routing
// ---------------------------------------------------------------------------
function route() {
  const h = location.hash.replace(/^#/, '') || '/home';
  const [path, query] = h.split('?');
  const params = {};
  (query || '').split('&').filter(Boolean).forEach((kv) => { const [k, v] = kv.split('='); params[decodeURIComponent(k)] = decodeURIComponent(v || ''); });
  const parts = path.split('/').filter(Boolean);
  return { name: parts[0] || 'home', id: parts[1], params: params };
}
function go(path) { if (location.hash === '#' + path) render(); else location.hash = path; }
window.addEventListener('hashchange', () => { leaveView(); render(); window.scrollTo(0, 0); });

let current = null;
function leaveView() { if (current && current.leave) current.leave(); current = null; }

// Guard links while recording or with unsaved typing.

    '<div style="margin-top:auto"></div>' +
    '<a class="nav-item' + (active === 'settings' ? ' active' : '') + '" href="#/settings">' + icon('gear', 17) + 'Settings</a>' +
    '</aside>';
  const top = '<header class="topbar"><span class="logo">L</span><b>Little</b><span class="grow"></span>' +
    '<button class="btn ghost icon" data-act="palette" aria-label="Search">' + icon('search') + '</button>' +
    '<a class="btn ghost icon" href="#/settings" aria-label="Settings">' + icon('gear') + '</a></header>';
  const tabs = '<nav class="tabbar">' +
    tab('home', 'Home', 'home', active) + tab('notes', 'Notes', 'notes', active) +

    '</nav>';
  return '<div class="shell">' + side + '<div class="main">' + top + '<main class="page' + (wide ? ' wide' : '') + '">' + inner + '</main></div>' + tabs + '</div>';
}
function tab(id, label, ic, active) { return '<a class="tab' + (active === id ? ' active' : '') + '" href="#/' + id + '">' + icon(ic, 20) + label + '</a>'; }

// ---------------------------------------------------------------------------
// Render loop
// ---------------------------------------------------------------------------
const VIEWS = {};
function render() {
  if (!S.ready) return;
  const r = route();
  const view = VIEWS[r.name] || VIEWS.home;
  // Keep focus and caret across re-renders.
  const ae = document.activeElement;
  const focusId = ae && ae.id;
  const sel = focusId && 'selectionStart' in ae ? [ae.selectionStart, ae.selectionEnd] : null;
  const out = view.html(r);
  $('#app').innerHTML = shell(out, r, view.wide);
  if (view.mount) view.mount(r);
  current = view;
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) { el.focus(); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) { /* not a text field */ } }
  }
}

// One click handler for the whole app: elements with data-act="name" call ACT[name].
const ACT = {};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  // Apps Script runs the page in an iframe: keep in-app links inside it.
  const a = e.target.closest('a[href^="#"]');
  if (a && !el && !e.metaKey && !e.ctrlKey) { e.preventDefault(); location.hash = a.getAttribute('href').slice(1); return; }
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); }
  if (e.key === 'Escape') closeModal();
});

// ---------------------------------------------------------------------------
// Modals
// ---------------------------------------------------------------------------
function openModal(html, onMount) {
  $('#modal-root').innerHTML = '<div class="backdrop" data-close="1"><div class="modal" role="dialog" aria-modal="true">' + html + '</div></div>';
  const bd = $('#modal-root .backdrop');
  bd.addEventListener('click', (e) => { if (e.target === bd) closeModal(); });
  if (onMount) onMount($('#modal-root .modal'));
}
function closeModal() { $('#modal-root').innerHTML = ''; }
ACT.closeModal = closeModal;

function promptModal(title, label, value, cb, okText) {
  openModal('<h3 class="h2">' + esc(title) + '</h3><form class="mt" id="pm"><label class="small muted">' + esc(label) + '</label>' +
    '<input class="input mt" id="pm-input" value="' + esc(value || '') + '" autocomplete="off"><div class="row mt" style="justify-content:flex-end">' +
    '<button type="button" class="btn ghost" data-act="closeModal">Cancel</button><button class="btn primary">' + esc(okText || 'Save') + '</button></div></form>', (m) => {
    const inp = $('#pm-input', m); inp.focus(); inp.select();
    $('#pm', m).addEventListener('submit', (e) => { e.preventDefault(); const v = inp.value.trim(); if (v) { closeModal(); cb(v); } });
  });
}
function confirmModal(title, body, okText, cb) {
  openModal('<h3 class="h2">' + esc(title) + '</h3><p class="muted">' + esc(body) + '</p><div class="row mt" style="justify-content:flex-end">' +
    '<button class="btn ghost" data-act="closeModal">Cancel</button><button class="btn accent" id="cm-ok">' + esc(okText) + '</button></div>', (m) => {
    $('#cm-ok', m).addEventListener('click', () => { closeModal(); cb(); });
  });
}

ACT.moreMenu = () => {
  const links = [['meetings', 'Meetings', 'calendar'], ['dictate', 'Dictate', 'wand'], ['inbox', 'Slack inbox', 'inbox'], ['ideas', 'Ideas', 'bulb'], ['ask', 'Ask your notes', 'chat'], ['settings', 'Settings', 'gear']];
  openModal('<div class="list">' + links.map((l) => '<a class="item" href="#/' + l[0] + '" data-act="navClose" data-to="' + l[0] + '">' + icon(l[2]) + '<span class="grow">' + l[1] + '</span>' + (l[0] === 'inbox' && S.inboxCount ? '<span class="badge">' + S.inboxCount + '</span>' : '') + '</a>').join('') + '</div>' +
    '<div class="nav-label"><span>Projects</span><button class="btn sm" data-act="newProject">+ New</button></div><div class="list">' +
    (S.projects.map((p) => '<a class="item" href="#/project/' + esc(p.id) + '" data-act="navClose" data-to="project/' + esc(p.id) + '"><span class="dot" style="background:' + esc(p.color) + '"></span>' + esc(p.name) + '</a>').join('') || '<div class="item muted small">No projects yet</div>') + '</div>');
};

// ---- Command palette (Ctrl/Cmd K) ---------------------------------------------
function openPalette() {
  const actions = [
    { label: 'Record a meeting', href: '#/record', ic: 'mic' }, { label: 'Write a note', href: '#/write', ic: 'pen' },
    { label: 'Dictate', href: '#/dictate', ic: 'wand' }, { label: 'To-dos', href: '#/todos', ic: 'checks' },
    { label: 'Meetings', href: '#/meetings', ic: 'calendar' }, { label: 'Ask your notes', href: '#/ask', ic: 'chat' },
    { label: 'Ideas', href: '#/ideas', ic: 'bulb' }, { label: 'Slack inbox', href: '#/inbox', ic: 'inbox' }, { label: 'Settings', href: '#/settings', ic: 'gear' },
  ];
  openModal('<div class="palette"><input class="input" id="pal" placeholder="Search notes, to-dos, or jump to…" autocomplete="off"><div id="pal-list" class="mt" style="max-height:55vh;overflow:auto"></div>' +
    '<p class="tiny muted mt">Enter to open · ' + '<span class="kbd">Esc</span> to close</p></div>', (m) => {
    const inp = $('#pal', m), list = $('#pal-list', m);
    let sel = 0, rows = [];
    const draw = () => {
      const q = inp.value.trim().toLowerCase();
      const hit = (s) => String(s || '').toLowerCase().indexOf(q) >= 0;
      rows = [];
      actions.filter((a) => !q || hit(a.label)).forEach((a) => rows.push({ html: icon(a.ic) + '<span class="grow">' + esc(a.label) + '</span>', href: a.href }));
      S.notes.filter((n) => !q || hit(n.title) || (n.tags || []).some(hit) || (n.attendees || []).some(hit)).slice(0, q ? 12 : 5)
        .forEach((n) => rows.push({ html: '<span class="note-icon">' + noteEmoji(n) + '</span><span class="grow ellipsis">' + esc(n.title) + '</span><span class="tiny muted">' + relDay(n.createdAt) + '</span>', href: noteHref(n) }));
      if (q) S.todos.filter((t) => hit(t.title)).slice(0, 6).forEach((t) => rows.push({ html: icon('checks') + '<span class="grow ellipsis">' + esc(t.title) + '</span><span class="tiny muted">To-do</span>', href: '#/todos' }));
      if (q) rows.push({ html: icon('search') + '<span class="grow">Search inside all notes for "' + esc(inp.value.trim()) + '"</span>', href: '#/notes?q=' + encodeURIComponent(inp.value.trim()) });
      sel = Math.min(sel, Math.max(0, rows.length - 1));
      list.innerHTML = rows.map((r, i) => '<a class="item' + (i === sel ? ' sel' : '') + '" href="' + r.href + '" data-act="closeModal">' + r.html + '</a>').join('') || '<p class="muted small">Nothing found.</p>';
    };
    inp.addEventListener('input', () => { sel = 0; draw(); });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, rows.length - 1); draw(); e.preventDefault(); }
      if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); draw(); e.preventDefault(); }
      if (e.key === 'Enter' && rows[sel]) { closeModal(); location.hash = rows[sel].href.slice(1); }
    });
    list.addEventListener('click', (e) => { const a = e.target.closest('a'); if (a) { e.preventDefault(); closeModal(); location.hash = a.getAttribute('href').slice(1); } });
    draw(); inp.focus();
  });
}
ACT.palette = openPalette;

function hasAi() { return !!(S.keys.gemini || S.keys.openai || S.keys.anthropic); }
function canTranscribe() { return !!(S.keys.gemini || S.keys.openai); }
function providerName() {
  const p = S.settings.aiProvider || ['gemini', 'openai', 'anthropic'].filter((x) => S.keys[x])[0];
  return { gemini: 'Gemini', openai: 'OpenAI', anthropic: 'Claude' }[p] || '';
}
function project(id) { return S.projects.filter((p) => p.id === id)[0]; }
function template(id) { return S.templates.filter((t) => t.id === id)[0] || S.templates[0]; }
function lang(code) { return S.languages.filter((l) => l.code === code)[0] || S.languages[0]; }
function noteHref(n) { return '#/note/' + encodeURIComponent(n.id) + (n.projectId ? '?p=' + encodeURIComponent(n.projectId) : ''); }
function noteEmoji(n) { return n.kind === 'written' ? '✍️' : template(n.template).emoji; }
function upsertLocal(list, item, key) { key = key || 'id'; const i = list.findIndex((x) => x[key] === item[key]); if (i >= 0) list[i] = item; else list.unshift(item); }

function noteRow(n, opts) {
  opts = opts || {};
  const p = project(n.projectId);
  const done = (n.actions || []).filter((a) => a.done).length, total = (n.actions || []).length;
  return '<a class="item" href="' + noteHref(n) + '"' + (opts.select ? ' data-act="toggleSelect" data-id="' + esc(n.id) + '"' : '') + '>' +
    (opts.select ? '<input type="checkbox" tabindex="-1"' + (S.selected && S.selected[n.id] ? ' checked' : '') + '>' : '') +
    '<span class="note-icon">' + noteEmoji(n) + '</span><span class="grow"><span class="row"><b class="ellipsis" style="font-weight:500">' + esc(n.title) + '</b>' + (n.pinned ? '<span class="muted">' + icon('pin', 13) + '</span>' : '') + '</span>' +
    '<span class="sub row wrap">' + relDay(n.createdAt) + ' · ' + fmtTime(n.createdAt) + (n.kind === 'written' ? '' : ' · ' + fmtDur(n.durationSec)) +
    (p ? ' · <span class="dot" style="background:' + esc(p.color) + '"></span>' + esc(p.name) : '') +
    (total ? ' · ' + done + '/' + total + ' done' : '') + (n.aiNotesFileId ? ' · ' + icon('sparkles', 12) : '') +
    (n.tags || []).map((t) => ' <span class="chip">#' + esc(t) + '</span>').join('') +
    (opts.snippet ? '<br><span class="small">' + esc(opts.snippet) + '</span>' : '') + '</span></span></a>';
}

}
ACT.keyOpened = () => { S.keyStep = Object.assign({}, S.keyStep, { opened: true }); setTimeout(render, 50); };
function bindKeyForm(root, after) {
  const f = $('[data-form="key"]', root || document);
  if (!f) return;
  const submit = async () => {
    const k = $('#gemini-key', f).value.trim();
    if (!k) return;
    S.busy.key = true; S.keyStep = Object.assign({}, S.keyStep, { error: '' }); render(); if (after) after(true);
    try {
      const r = await api('saveKey', 'gemini', k);
      S.settings = r.settings; S.keys = r.keys; S.keyStep = {};
      toast('AI is on. Your free Gemini key works.');
      if (after) after(false, true);
    } catch (e) { S.keyStep = Object.assign({}, S.keyStep, { error: e.message }); }
    delete S.busy.key; render(); if (after) after(false);
  };
  f.addEventListener('submit', (e) => { e.preventDefault(); submit(); });
  $('#gemini-key', f).addEventListener('paste', () => setTimeout(submit, 30));
}
function openKeyModal(reason) {
  const draw = () => openModal('<div class="spread"><b>' + esc(reason || 'This needs AI') + '</b><button class="btn ghost icon" data-act="closeModal">' + icon('x') + '</button></div><div class="mt">' + keySetupHtml(true) + '</div>' +
    '<p class="tiny muted mt">Prefer OpenAI or Claude? Add those keys in <a href="#/settings" data-act="closeModal">Settings</a>.</p>', (m) => bindKeyForm(m, (_, ok) => { if (ok) closeModal(); else if ($('#modal-root .modal')) draw(); }));
  draw();
}

}

async function loadEvents() {

function notesView(r, projectId) {
  const q = (S.notesQuery != null ? S.notesQuery : r.params.q || '');
  const tag = S.notesTag || '';
  let notes = S.notes.filter((n) => !projectId || n.projectId === projectId);
  const tags = Array.from(new Set(notes.reduce((a, n) => a.concat(n.tags || []), []))).sort();
  if (tag) notes = notes.filter((n) => (n.tags || []).indexOf(tag) >= 0);
  let deep = null;
  if (q.trim()) {
    const ql = q.toLowerCase();
    const quickHits = notes.filter((n) => (n.title + ' ' + (n.tags || []).join(' ') + ' ' + (n.attendees || []).join(' ')).toLowerCase().indexOf(ql) >= 0);
    deep = (S.deepResults && S.deepResults.q === q) ? S.deepResults.items : null;
    const ids = {};
    notes = quickHits.concat((deep || []).map((d) => { const n = S.notes.filter((x) => x.id === d.id)[0]; return n && (!projectId || n.projectId === projectId) ? Object.assign({ _snippet: d.snippet }, n) : null; }).filter(Boolean))
      .filter((n) => !ids[n.id] && (ids[n.id] = 1));
  }
  const pinned = notes.filter((n) => n.pinned);
  const rest = notes.filter((n) => !n.pinned);
  const selecting = !!S.selected;
  const selCount = selecting ? Object.keys(S.selected).length : 0;
  const p = project(projectId);
  let html = '';
  if (p) {
    html += '<div class="spread"><div class="row"><span class="dot" style="background:' + esc(p.color) + ';width:14px;height:14px"></span><h1 class="display">' + esc(p.name) + '</h1></div>' +
      '<div class="row"><button class="btn sm" data-act="shareProject">' + icon('users', 14) + (p.role === 'member' ? ' Members' : ' Share') + '</button><button class="btn sm icon" data-act="projectMenu" aria-label="Project options">' + icon('more') + '</button></div></div>' +
      '<p class="muted small">' + (p.role === 'member' ? 'Shared with you by ' + esc(p.owner || 'a teammate') + '. ' : p.shared ? 'Shared with your team. ' : '') + 'Notes and team to-dos for this project live in its Drive folder.</p>' +
      (p.unavailable ? '<p class="notice">This project can\'t be opened right now. It may have been unshared or deleted.</p>' : '');
  } else {
    html += '<div class="spread"><h1 class="display">Notes</h1><div class="row"><a class="btn sm" href="#/write">' + icon('pen', 14) + ' Write</a><a class="btn sm accent" href="#/record">' + icon('mic', 14) + ' Record</a></div></div>';
  }
  html += '<div class="row mt"><input class="input pill grow" id="notes-q" placeholder="Search titles, notes, transcripts…" value="' + esc(q) + '">' +
    '<button class="btn sm' + (selecting ? ' primary' : '') + '" data-act="selectMode">' + (selecting ? 'Done' : 'Select') + '</button></div>';
  if (tags.length) html += '<div class="chips mt"><button class="chip' + (!tag ? ' on' : '') + '" data-act="tagFilter" data-tag="">All</button>' + tags.map((t) => '<button class="chip' + (tag === t ? ' on' : '') + '" data-act="tagFilter" data-tag="' + esc(t) + '">#' + esc(t) + '</button>').join('') + '</div>';
  if (selecting) html += '<div class="row mt notice"><b>' + selCount + ' selected</b><span class="grow"></span><button class="btn sm" data-act="moveSelected"' + (selCount ? '' : ' disabled') + '>' + icon('folder', 14) + ' Move to…</button></div>';
  if (q.trim() && !deep) html += '<p class="small muted mt">' + spin() + ' Searching inside notes and transcripts…</p>';
  if (!notes.length) {
    html += '<div class="empty card mt"><div class="big">' + (q ? '🔎' : '📝') + '</div>' + (q ? 'No notes match "' + esc(q) + '".' : p ? 'No notes in this project yet. Record or write one and pick this project.' : 'Your notes will show up here.') + '</div>';
  } else {
    if (pinned.length) html += '<h2 class="small muted mt2">Pinned</h2><div class="list mt">' + pinned.map((n) => noteRow(n, { select: selecting, snippet: n._snippet })).join('') + '</div>';
    html += groupByDay(rest).map((g) => '<h2 class="small muted mt2">' + g.label + '</h2><div class="list mt">' + g.items.map((n) => noteRow(n, { select: selecting, snippet: n._snippet })).join('') + '</div>').join('');
  }
  if (p) html += projectTodosHtml(p);
  return html;
}
function groupByDay(notes) {
  const groups = [];
  notes.forEach((n) => {
    const d = new Date(n.createdAt), t = today();
    const label = localDay(d) === t ? 'Today' : localDay(d) >= addDays(t, -7) ? 'This week' : d.toLocaleDateString([], { month: 'long', year: 'numeric' });
    const g = groups[groups.length - 1];
    if (g && g.label === label) g.items.push(n); else groups.push({ label: label, items: [n] });
  });
  return groups;
}
function projectTodosHtml(p) {
  const todos = S.todos.filter((t) => t.projectId === p.id && t.status !== 'done');
  return '<div class="spread mt2"><h2 class="h2">Team to-dos</h2><a class="small muted" href="#/todos?project=' + esc(p.id) + '">Board</a></div>' +
    (todos.length ? '<div class="list mt">' + todos.slice(0, 8).map((t) => '<div class="item"><span class="dot" style="background:' + STATUSES.filter((s) => s.id === t.status)[0].color + '"></span><span class="grow">' + esc(t.title) + (t.owner ? ' <span class="sub">· ' + esc(t.owner) + '</span>' : '') + '</span>' + (t.due ? '<span class="tiny muted">' + fmtDue(t.due) + '</span>' : '') + '</div>').join('') + '</div>' : '<p class="small muted">Nothing open.</p>');
}
let searchTimer = null;
function mountNotes(r) {
  const inp = $('#notes-q');
  if (!inp) return;
  if (r.params.q && S.notesQuery == null) { S.notesQuery = r.params.q; runDeepSearch(r.params.q); }
  inp.addEventListener('input', () => {
    S.notesQuery = inp.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => runDeepSearch(inp.value), 450);
    render();
  });
}
async function runDeepSearch(q) {
  if (!q.trim()) return render();
  try { const items = await api('searchNotes', q); if (S.notesQuery === q || (!S.notesQuery && route().params.q === q)) { S.deepResults = { q: q, items: items }; render(); } }
  catch (e) { S.deepResults = { q: q, items: [] }; fail(e); }
}

VIEWS.project = { html: (r) => notesView(r, r.id), mount: mountNotes, leave() { S.notesQuery = null; S.selected = null; S.notesTag = ''; } };

ACT.tagFilter = (el) => { S.notesTag = el.dataset.tag; render(); };
ACT.selectMode = () => { S.selected = S.selected ? null : {}; render(); };
ACT.toggleSelect = (el) => { const id = el.dataset.id; if (S.selected[id]) delete S.selected[id]; else S.selected[id] = 1; render(); };
ACT.moveSelected = () => {
  const ids = Object.keys(S.selected || {});
  pickProject('Move ' + ids.length + ' note' + (ids.length === 1 ? '' : 's') + ' to', async (target) => {
    const items = S.notes.filter((n) => ids.indexOf(n.id) >= 0).map((n) => ({ id: n.id, projectId: n.projectId || null }));
    try { S.notes = await api('moveNotes', items, target); S.selected = null; toast('Moved'); render(); } catch (e) { fail(e); }
  });

async function openNote(id, projectId) {
  S.noteLoading = true; S.noteError = null;
  try { S.note = await api('getNote', id, projectId); S.noteBody = null; S.noteDirty = false; }
  catch (e) { S.noteError = e.message; }
  S.noteLoading = false;
  render();
}
function syncNoteMeta(meta) { const i = S.notes.findIndex((n) => n.id === meta.id); if (i >= 0) S.notes[i] = meta; else S.notes.unshift(meta); }
async function saveTitle(t) {
  const N = S.note; t = t.trim() || 'Untitled';
  try { N.meta = await api('updateNote', N.meta.id, N.meta.projectId || null, { title: t, notes: S.noteBody != null ? S.noteBody : N.notes }); syncNoteMeta(N.meta); toast('Saved'); } catch (e) { fail(e); }
}
async function saveNoteBody() {
  const N = S.note;
  if (!N || !S.noteDirty) return;
  S.noteSaving = true; S.noteDirty = false;
  const text = S.noteBody;
  const el = $('#save-state'); if (el) el.textContent = 'Saving…';
  try { N.meta = await api('updateNote', N.meta.id, N.meta.projectId || null, { title: N.meta.title, notes: text }); N.notes = text; syncNoteMeta(N.meta); }
  catch (e) { S.noteDirty = true; fail(e); }
  S.noteSaving = false;
  const el2 = $('#save-state'); if (el2) el2.textContent = S.noteDirty ? 'Unsaved' : 'Saved';
}
ACT.noteTab = (el) => { if (S.noteDirty) saveNoteBody(); S.noteTab = el.dataset.tab; render(); };
ACT.genNotes = () => busy('ai', async () => {
  const N = S.note;
  if (!hasAi()) throw new Error('NEED_KEY: Turn on AI to write meeting notes.');
  S.noteTab = 'ai';
  const r = await api('generateNotes', N.meta.id, N.meta.projectId || null);
  N.meta = r.meta; N.aiNotes = r.markdown; N.showTranslation = null; syncNoteMeta(r.meta);
  toast('AI notes are ready ✨');
});

async function toggleTask(i, done) {
  const N = S.note;
  try { const r = await api('toggleAction', N.meta.id, N.meta.projectId || null, i, done); N.meta = r.meta; N.aiNotes = r.markdown; syncNoteMeta(r.meta); render(); if (done) toast('Nice, one less thing ✓'); }
  catch (e) { fail(e); render(); }

function parseAction(text) {
  const clean = (s) => String(s).replace(/\*\*/g, '').trim();
  const m = String(text).match(/^\*\*([^*]+)\*\*\s*[:\-–]\s*(.+)$/);
  if (!m) return { title: clean(text) };
  const t = clean(m[2]);
  return { owner: clean(m[1]), title: t.charAt(0).toUpperCase() + t.slice(1) };
}
ACT.actionTodo = async (el) => {
  const N = S.note;
  const a = (N.meta.actions || [])[Number(el.dataset.i)];

  el.disabled = true;
  try { const t = await api('addActionToTodo', N.meta.id, N.meta.projectId || null, a.text); upsertLocal(S.todos, t); toast('Added to to-dos'); render(); } catch (e) { fail(e); el.disabled = false; }

ACT.loadAudio = () => busy('audio', async () => {
  const N = S.note;
  const r = await api('getAudio', N.meta.id, N.meta.projectId || null);
  if (r.tooLarge) { S.audioTooLarge = true; return; }
  const bin = atob(r.data); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  S.audioUrl = URL.createObjectURL(new Blob([bytes], { type: r.mime }));
  setTimeout(() => { const p = $('#player'); if (p) p.play().catch(() => {}); }, 100);
});

ACT.todoScope = (el) => { S.todoScope = el.dataset.s; render(); };
async function setStatus(id, status) {

  const before = t.status;

  if (status === 'done') toast('Done! 🎉');
  try { upsertLocal(S.todos, await api('saveTodo', t, t.projectId || null)); render(); } catch (e) { t.status = before; render(); fail(e); }

ACT.editTodo = (el, e) => { if (e.target.closest('select')) return; const t = S.todos.filter((x) => x.id === el.dataset.id)[0]; if (t) todoModal(t); };
function todoModal(t) {
  const isNew = !t.id;
  openModal('<h3 class="h2">' + (isNew ? 'New to-do' : 'Edit to-do') + '</h3><form id="td-form" class="stack mt">' +
    '<input class="input" id="td-title" placeholder="What needs doing?" value="' + esc(t.title || '') + '" required>' +
    '<div class="row wrap"><select class="input grow" id="td-project"><option value="">Personal (only you)</option>' + S.projects.filter((p) => !p.unavailable).map((p) => '<option value="' + esc(p.id) + '"' + (p.id === t.projectId ? ' selected' : '') + '>' + esc(p.name) + ' (team)</option>').join('') + '</select>' +
    '<select class="input grow" id="td-status">' + STATUSES.map((s) => '<option value="' + s.id + '"' + (s.id === t.status ? ' selected' : '') + '>' + s.name + '</option>').join('') + '</select></div>' +
    '<div class="row wrap"><input class="input grow" id="td-owner" placeholder="Owner (name or email)" value="' + esc(t.owner || '') + '"><input class="input grow" id="td-due" type="date" value="' + esc(t.due || '') + '"></div>' +
    '<label class="check small"><input type="checkbox" id="td-urgent"' + (t.urgent ? ' checked' : '') + '> Urgent</label>' +
    (t.link ? '<a class="small" href="' + esc(t.link) + '" target="_blank" rel="noopener">' + icon('slack', 13) + ' Open the Slack message</a>' : '') +
    '<div class="row" style="justify-content:space-between">' + (isNew ? '<span></span>' : '<button type="button" class="btn ghost danger" id="td-del">' + icon('trash', 14) + ' Delete</button>') +
    '<div class="row"><button type="button" class="btn ghost" data-act="closeModal">Cancel</button><button class="btn primary">Save</button></div></div></form>', (m) => {
    $('#td-title', m).focus();

      e.preventDefault();
      const next = Object.assign({}, t, {
        title: $('#td-title', m).value.trim(), projectId: $('#td-project', m).value || undefined, status: $('#td-status', m).value,
        owner: $('#td-owner', m).value.trim() || undefined, due: $('#td-due', m).value || undefined, urgent: $('#td-urgent', m).checked,
      });
      if (!next.title) return;
      closeModal();
      try { const saved = await api('saveTodo', next, isNew ? undefined : (t.projectId || null)); upsertLocal(S.todos, saved); render(); toast(isNew ? 'Added' : 'Saved'); } catch (err) { fail(err); }
    });

    if (del) del.addEventListener('click', async () => {
      closeModal();

}

VIEWS.meetings = {
  html() {
    let html = '<div class="spread"><h1 class="display">Meetings</h1><button class="btn sm" data-act="reloadEvents">' + icon('refresh', 14) + ' Refresh</button></div><p class="muted small">From your Google Calendar. Record with the right title, people and template, and the notes link back to the meeting.</p>';
    if (!S.events) { if (!S.eventsLoading) setTimeout(loadEvents, 0); return html + '<div class="empty">' + spin() + '</div>'; }
    if (S.eventsError) html += '<p class="notice">' + esc(S.eventsError) + '</p>';
    const now = new Date();
    const upcoming = S.events.filter((e) => new Date(e.end) >= now && !e.allDay);
    const past = S.events.filter((e) => new Date(e.end) < now && !e.allDay).reverse();
    const notesFor = (e) => S.notes.filter((n) => n.calendarEventId === e.eventId && localDay(n.createdAt) === localDay(e.start));
    const row = (e) => {
      const ns = notesFor(e);
      const live = new Date(e.start) <= now && new Date(e.end) >= now;
      return '<div class="item"><span class="note-icon" style="flex-direction:column;width:46px;height:46px;font-size:11px;line-height:1.1"><b>' + new Date(e.start).toLocaleDateString([], { weekday: 'short' }) + '</b>' + new Date(e.start).getDate() + '</span>' +
        '<span class="grow"><b style="font-weight:500">' + esc(e.title) + '</b>' + (live ? ' <span class="chip" style="background:var(--accent);color:#fff">Now</span>' : '') + '<span class="sub"><br>' + fmtTime(e.start) + '–' + fmtTime(e.end) + ' · ' + e.attendees.length + ' people' + (e.meetLink ? ' · <a href="' + esc(e.meetLink) + '" target="_blank" rel="noopener">Join Meet</a>' : '') + '</span></span>' +
        (ns.length ? '<a class="btn sm" href="' + noteHref(ns[0]) + '">' + icon('notes', 14) + ' Notes</a>' : '<button class="btn sm' + (live ? ' accent' : '') + '" data-act="recordEvent" data-id="' + esc(e.id) + '">' + icon('mic', 14) + ' Record</button>') + '</div>';
    };
    const days = {};
    upcoming.forEach((e) => { const k = localDay(e.start); (days[k] = days[k] || []).push(e); });
    html += Object.keys(days).length ? Object.keys(days).sort().map((d) => '<h2 class="small muted mt2">' + relDay(d + 'T12:00:00') + '</h2><div class="list mt">' + days[d].map(row).join('') + '</div>').join('')
      : '<div class="empty card mt">No meetings in the next week.</div>';
    if (past.length) html += '<h2 class="h2 mt2">Last 7 days</h2><div class="list mt">' + past.slice(0, 20).map(row).join('') + '</div>';
    return html;
  },
};

  html() {
    const s = S.settings;
    const keyRow = (p, name, hint, link) => '<div class="item" style="align-items:flex-start"><span class="grow"><b style="font-weight:500">' + name + '</b>' + (S.keys[p] ? ' <span class="chip">' + icon('check', 12) + ' ' + esc(S.keys[p]) + '</span>' : '') + '<span class="sub"><br>' + hint + ' <a href="' + link + '" target="_blank" rel="noopener">Get a key</a></span>' +
      '<form class="row mt" data-keyform="' + p + '"><input class="input pill grow" type="password" autocomplete="off" placeholder="' + (S.keys[p] ? 'Replace key' : 'Paste key') + '"><button class="btn sm">' + (S.busy['key' + p] ? spin() : 'Save') + '</button>' + (S.keys[p] ? '<button type="button" class="btn sm ghost" data-act="removeKey" data-p="' + p + '">Remove</button>' : '') + '</form></span></div>';
    return '<h1 class="display">Settings</h1>' +
      '<h2 class="h2 mt2">AI</h2><p class="small muted">' + (hasAi() ? 'AI is on, using <b>' + esc(providerName()) + '</b>.' : 'AI is off. Recording, notes and to-dos work without it.') + '</p>' +
      (!S.keys.gemini ? keySetupHtml() : '') +
      '<div class="list mt">' + keyRow('gemini', 'Gemini (free)', 'Notes, transcripts with speaker labels, Slack inbox.', 'https://aistudio.google.com/apikey') +
      keyRow('openai', 'OpenAI', 'Notes and Whisper transcripts.', 'https://platform.openai.com/api-keys') +
      keyRow('anthropic', 'Claude', 'Notes and dictation clean-up. Claude can\'t transcribe audio.', 'https://console.anthropic.com/settings/keys') + '</div>' +
      '<div class="row mt"><label class="small" for="set-provider">Use for text</label><select class="input pill" id="set-provider" style="width:auto"><option value="">Automatic</option>' + ['gemini', 'openai', 'anthropic'].filter((p) => S.keys[p]).map((p) => '<option value="' + p + '"' + (s.aiProvider === p ? ' selected' : '') + '>' + { gemini: 'Gemini', openai: 'OpenAI', anthropic: 'Claude' }[p] + '</option>').join('') + '</select></div>' +
      '<h2 class="h2 mt2">Recording</h2><div class="card mt stack"><label class="check"><input type="checkbox" id="set-audio"' + (s.saveAudio ? ' checked' : '') + '> Save the audio to Drive (needed for AI transcripts and playback)</label>' +
      '<div class="row"><label class="small" for="set-lang">Default language</label><select class="input pill" id="set-lang" style="width:auto">' + S.languages.map((l) => '<option value="' + l.code + '"' + (l.code === s.defaultLanguage ? ' selected' : '') + '>' + esc(l.name) + ' · ' + esc(l.native) + '</option>').join('') + '</select></div></div>' +
      '<h2 class="h2 mt2">Slack</h2><div class="card mt spread"><span>' + (S.slack.connected ? 'Connected to <b>' + esc(S.slack.team) + '</b>' : 'Not connected') + '</span><a class="btn sm" href="#/inbox">' + (S.slack.connected ? 'Open inbox' : 'Connect') + '</a></div>' +
      '<h2 class="h2 mt2">Your data</h2><div class="list mt"><a class="item" href="' + esc(S.folderUrl) + '" target="_blank" rel="noopener">' + icon('folder') + '<span class="grow">Little folder in Google Drive<span class="sub"><br>Every note as readable files, plus recordings</span></span>' + icon('external', 14) + '</a>' +
      '<a class="item" href="' + esc(S.dataUrl) + '" target="_blank" rel="noopener">' + icon('doc') + '<span class="grow">"Little data" spreadsheet<span class="sub"><br>Notes list, projects, to-dos, ideas, inbox</span></span>' + icon('external', 14) + '</a>' +
      '<a class="item" href="#/join">' + icon('users') + '<span class="grow">Join a shared project</span></a></div>' +
      '<h2 class="h2 mt2">On your phone</h2><p class="small muted">Open this link on your phone and add it to your home screen: <span style="user-select:all">' + esc(S.appUrl) + '</span></p>' +
      '<p class="tiny muted mt2">Signed in as ' + esc(S.user.email) + '.</p>';
  },
  mount() {
    bindKeyForm();
    $$('[data-keyform]').forEach((f) => f.addEventListener('submit', (e) => {
      e.preventDefault();
      const p = f.dataset.keyform, v = $('input', f).value.trim();
      if (!v) return;
      busy('key' + p, async () => { const r = await api('saveKey', p, v); S.settings = r.settings; S.keys = r.keys; toast('Key saved'); });
    }));
    const save = (patch) => api('saveSettings', patch).then((r) => { S.settings = r.settings; S.keys = r.keys; toast('Saved'); render(); }).catch(fail);
    $('#set-provider').addEventListener('change', (e) => save({ aiProvider: e.target.value || null }));
    $('#set-audio').addEventListener('change', (e) => save({ saveAudio: e.target.checked }));
    $('#set-lang').addEventListener('change', (e) => save({ defaultLanguage: e.target.value }));
  },
};
ACT.removeKey = (el) => busy('key' + el.dataset.p, async () => { const r = await api('saveKey', el.dataset.p, ''); S.settings = r.settings; S.keys = r.keys; toast('Key removed'); });

// ---------------------------------------------------------------------------
// Start
// ---------------------------------------------------------------------------
function applyBootstrap(d) {
  Object.assign(S, d);
  S.ready = true;
}
function boot() {
  api('bootstrap').then((d) => {
    applyBootstrap(d);
    const join = $('#app').getAttribute('data-join');
    if (join) { S.joinRef = join; S.autoJoin = true; location.hash = '/join'; }
    render();
  }).catch((e) => {
    $('#app').innerHTML = '<div class="splash"><div class="splash-mark">L</div><p><b>Little couldn\'t start.</b></p><p class="small" style="max-width:420px">' + esc(e.message) + '</p><p><button class="btn" onclick="location.reload()">Try again</button></p></div>';
  });
}
boot();
})();
</script>
