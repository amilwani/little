<style>
  :root {
    --bg: #ffffff;
    --fg: #37352f;
    --muted: #787774;
    --card: #ffffff;
    --border: #e9e9e7;
    --subtle: #f1f1ef;
    --sidebar: #f8f8f7;
    --accent: #dc5a45;
    --accent-soft: #fbecea;
    --ok: #2a9d8f;
    --serif: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", system-ui, sans-serif;
    --idea-plain: var(--card); --idea-sun: #fff6d6; --idea-peach: #ffe9dc; --idea-rose: #fde4ea;
    --idea-lilac: #efe6fd; --idea-sky: #e1effd; --idea-mint: #ddf5ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191919; --fg: #e6e6e4; --muted: #9b9a97; --card: #202020; --border: #2f2f2f;
      --subtle: #2a2a2a; --sidebar: #202020; --accent: #ef7a66; --accent-soft: #3a2420;
      --idea-sun: #3a3420; --idea-peach: #3b2a21; --idea-rose: #3a2229; --idea-lilac: #2d2540;
      --idea-sky: #1f2c3b; --idea-mint: #1e3530;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px;
    line-height: 1.5; letter-spacing: -0.006em; -webkit-tap-highlight-color: transparent; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input:focus-visible, textarea:focus-visible, select:focus-visible { outline: none; border-color: color-mix(in srgb, var(--fg) 35%, transparent); }
  [hidden] { display: none !important; }

  .splash { min-height: 100vh; display: grid; place-content: center; text-align: center; color: var(--muted); }
  .splash-mark, .logo { width: 44px; height: 44px; border-radius: 14px; background: var(--accent); color: #fff; display: grid;
    place-items: center; font: 600 24px var(--serif); margin: 0 auto 12px; }
  .logo { width: 28px; height: 28px; border-radius: 9px; font-size: 16px; margin: 0; }

  /* Layout */
  .shell { display: flex; min-height: 100vh; }
  .sidebar { width: 248px; flex-shrink: 0; background: var(--sidebar); border-right: 1px solid var(--border); padding: 14px 10px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 12px; font-weight: 600; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 8px; color: var(--fg);
    text-decoration: none; border: 0; background: none; width: 100%; text-align: left; font-size: 14px; }
  .nav-item:hover { background: var(--subtle); }
  .nav-item.active { background: var(--subtle); font-weight: 600; }
  .nav-item .badge { margin-left: auto; }
  .nav-label { font-size: 12px; color: var(--muted); padding: 14px 10px 4px; display: flex; justify-content: space-between; align-items: center; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
  .main { flex: 1; min-width: 0; }
  .page { max-width: 920px; margin: 0 auto; padding: 28px 24px 64px; }
  .page.wide { max-width: 1240px; }
  .tabbar { display: none; }
  .topbar { display: none; }
  @media (max-width: 767px) {
    .sidebar { display: none; }
    .page { padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); }
    .topbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--bg); z-index: 20; }
    .tabbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--bg);
      border-top: 1px solid var(--border); padding: 6px 8px max(8px, env(safe-area-inset-bottom)); justify-content: space-around; }
    .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted);
      text-decoration: none; background: none; border: 0; padding: 4px 0; }
    .tab.active { color: var(--fg); font-weight: 600; }
    .tab-rec { width: 52px; height: 52px; flex: 0 0 52px; border-radius: 50%; background: var(--accent); color: #fff; display: grid;
      place-items: center; margin-top: -22px; box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 40%, transparent); border: 0; }
  }

  /* Type */
  h1, h2, h3 { margin: 0; line-height: 1.25; }
  .display { font-family: var(--serif); font-weight: 500; font-size: 32px; letter-spacing: -0.02em; }
  .h2 { font-size: 18px; font-weight: 600; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .tiny { font-size: 12px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row.wrap { flex-wrap: wrap; }
  .spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .stack > * + * { margin-top: 12px; }
  .grow { flex: 1; min-width: 0; }
  .mt { margin-top: 16px; } .mt2 { margin-top: 28px; } .mb { margin-bottom: 16px; }
  .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Controls */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--card); padding: 7px 14px; font-size: 14px; font-weight: 500; text-decoration: none; transition: transform .1s, background .15s; white-space: nowrap; }
  .btn:hover { background: var(--subtle); }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .btn.primary:hover { opacity: .9; }
  .btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.ghost { border-color: transparent; background: none; }
  .btn.ghost:hover { background: var(--subtle); }
  .btn.sm { padding: 4px 10px; font-size: 13px; }
  .btn.icon { padding: 7px; }
  .btn.danger { color: var(--accent); }
  .input, select.input, textarea.input { width: 100%; border: 1px solid var(--border); background: var(--bg); border-radius: 10px; padding: 8px 12px; }
  textarea.input { resize: vertical; min-height: 120px; line-height: 1.55; }
  .input.pill { border-radius: 999px; }
  .title-input { border: 0; background: none; font: 500 28px var(--serif); width: 100%; padding: 0; letter-spacing: -0.02em; }
  .title-input:focus { outline: none; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 12.5px;
    background: var(--subtle); border: 1px solid transparent; white-space: nowrap; }
  button.chip.on, .chip.on { background: var(--fg); color: var(--bg); }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .badge { background: var(--accent); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 6px; min-width: 18px; text-align: center; font-weight: 600; }
  .seg { display: inline-flex; background: var(--subtle); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: none; border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--muted); }
  .seg button.on { background: var(--card); color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  label.check { display: flex; gap: 10px; align-items: center; }

  /* Cards and lists */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; }
  .card.tight { padding: 12px 14px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .grid-2 { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 767px) { .grid-2 { grid-template-columns: 1fr; } .display { font-size: 26px; } }
  .list { border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: var(--card); }
  .item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--border); text-decoration: none; color: inherit; }
  .item:first-child { border-top: 0; }
  .item:hover { background: var(--subtle); }
  .item .sub { font-size: 12.5px; color: var(--muted); }
  .note-icon { width: 34px; height: 34px; border-radius: 10px; background: var(--subtle); display: grid; place-items: center; flex-shrink: 0; font-size: 16px; }
  .empty { text-align: center; padding: 36px 16px; color: var(--muted); }
  .empty .big { font-size: 34px; margin-bottom: 6px; }
  .quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 767px) { .quick { grid-template-columns: repeat(2, 1fr); } }
  .quick a { display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 14px; border: 1px solid var(--border);
    background: var(--card); text-decoration: none; transition: transform .12s; }
  .quick a:hover { transform: translateY(-1px); background: var(--subtle); }
  .quick .qi { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: #fff; }
  .ring { width: 84px; height: 84px; flex-shrink: 0; }
  .hero { background: linear-gradient(135deg, var(--accent-soft), transparent 70%); border: 1px solid var(--border); border-radius: 20px; padding: 22px; }

  /* Markdown */
  .md { line-height: 1.6; overflow-wrap: anywhere; }
  .md h2, .md h3, .md h4 { margin: 18px 0 6px; font-size: 16px; font-weight: 600; }
  .md h2:first-child, .md h3:first-child { margin-top: 0; }
  .md p { margin: 6px 0; }
  .md ul, .md ol { margin: 6px 0; padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md li.task { list-style: none; margin-left: -22px; display: flex; gap: 8px; align-items: flex-start; }
  .md li.task input { margin-top: 5px; accent-color: var(--accent); }
  .md li.task.done > span { color: var(--muted); text-decoration: line-through; }
  .md li.task .btn { margin-left: auto; }
  .md code { background: var(--subtle); border-radius: 5px; padding: 1px 5px; font-size: 13px; }
  .md a { color: var(--accent); }
  .cite { display: inline-grid; place-items: center; min-width: 18px; height: 18px; border-radius: 6px; background: var(--accent-soft); color: var(--accent);
    font-size: 11px; font-weight: 600; text-decoration: none; padding: 0 4px; vertical-align: 1px; }

  /* Recorder */
  .rec-bar { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 18px; background: var(--card);
    position: sticky; top: 8px; z-index: 10; }
  .rec-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); animation: pulse 1.4s infinite; }
  .rec-dot.paused { animation: none; background: var(--muted); }
  @keyframes pulse { 50% { opacity: .35; transform: scale(.8); } }
  .timer { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 20px; }
  .big-rec { width: 96px; height: 96px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; display: grid; place-items: center;
    margin: 8px auto; box-shadow: 0 10px 30px color-mix(in srgb, var(--accent) 35%, transparent); transition: transform .12s; }
  .big-rec:active { transform: scale(.95); }
  .big-rec.on { animation: breathe 2s infinite; }
  @keyframes breathe { 50% { box-shadow: 0 0 0 16px color-mix(in srgb, var(--accent) 12%, transparent); } }
  .transcript { max-height: 60vh; overflow-y: auto; }
  .seg-line { display: flex; gap: 10px; padding: 5px 6px; border-radius: 8px; cursor: default; }
  .seg-line.play { cursor: pointer; }
  .seg-line.play:hover { background: var(--subtle); }
  .seg-time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 40px; padding-top: 2px; }
  .speaker { font-weight: 600; }
  .interim { color: var(--muted); font-style: italic; }
  .wave { display: flex; gap: 3px; align-items: center; height: 28px; }
  .wave span { width: 3px; border-radius: 2px; background: var(--accent); height: 20%; transition: height .1s; }

  /* To-do board */
  .board { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
  .col { background: var(--subtle); border-radius: 14px; padding: 10px; min-height: 160px; }
  .col.drop { outline: 2px dashed var(--accent); }
  .col-head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 2px 4px 10px; }
  .todo { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; cursor: grab; }
  .todo.done .t-title { text-decoration: line-through; color: var(--muted); }
  .todo .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; font-size: 12px; color: var(--muted); align-items: center; }
  .urgent { color: var(--accent); font-weight: 600; }
  .stat { padding: 14px; border-radius: 14px; border: 1px solid var(--border); background: var(--card); }
  .stat b { display: block; font-size: 24px; font-family: var(--serif); font-weight: 500; }
  .bar { height: 6px; background: var(--subtle); border-radius: 99px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--ok); border-radius: 99px; }
  @media (max-width: 767px) { .board { grid-template-columns: 1fr; } }

  /* Ideas */
  .ideas { columns: 3 240px; column-gap: 12px; }
  .idea { break-inside: avoid; margin-bottom: 12px; border-radius: 16px; padding: 14px; border: 1px solid var(--border); }
  .idea textarea { width: 100%; border: 0; background: none; resize: none; min-height: 60px; }
  .idea textarea:focus { outline: none; }
  .swatch { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--border); padding: 0; }
  .swatch.on { outline: 2px solid var(--fg); outline-offset: 1px; }
  .riff { margin-top: 10px; padding-top: 10px; border-top: 1px dashed color-mix(in srgb, var(--fg) 20%, transparent); font-size: 14px; }

  /* Modals, toasts, menus */
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 100; display: flex; align-items: flex-start; justify-content: center;
    padding: 10vh 16px 16px; animation: fade .15s; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 18px; width: 100%; max-width: 520px; max-height: 80vh; overflow-y: auto;
    padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
  @media (max-width: 767px) { .backdrop { align-items: flex-end; padding: 0; } .modal { border-radius: 18px 18px 0 0; max-width: none; padding-bottom: max(20px, env(safe-area-inset-bottom)); } }
  @keyframes fade { from { opacity: 0; } }
  #toast-root { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  @media (max-width: 767px) { #toast-root { bottom: calc(84px + env(safe-area-inset-bottom)); } }
  .toast { background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.2);
    animation: rise .2s; max-width: 90vw; }
  .toast.err { background: var(--accent); color: #fff; }
  @keyframes rise { from { transform: translateY(8px); opacity: 0; } }
  .palette input { border: 0; border-bottom: 1px solid var(--border); border-radius: 0; padding: 4px 2px 12px; font-size: 17px; }
  .palette .item { border-radius: 10px; border: 0; }
  .palette .item.sel { background: var(--subtle); }
  .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .step { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; flex-shrink: 0; background: var(--subtle); color: var(--muted); }
  .step.now { background: var(--fg); color: var(--bg); }
  .step.done { background: var(--accent); color: #fff; }
  .kbd { border: 1px solid var(--border); border-radius: 6px; padding: 0 6px; font-size: 11px; color: var(--muted); }
  .notice { border-radius: 12px; padding: 10px 14px; background: var(--accent-soft); font-size: 14px; }
  .pop { animation: pop .35s; }
  @keyframes pop { 40% { transform: scale(1.06); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
